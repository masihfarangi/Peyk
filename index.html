<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <meta name="description" content="Peyk sends a courier on a bike or on foot to move small things across town." />
    <meta name="theme-color" content="#CB2027" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#CB2027" />
    <meta name="color-scheme" content="light" />

    <!-- iOS standalone behaviour -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Peyk" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="./icons/mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>Peyk — courier by bike or on foot</title>

    <style>
      /* Boot splash. Lives in the HTML so it paints before any JS parses,
         and is removed by src/main.tsx once React has mounted. */
      #peyk-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        background: #ffffff;
        z-index: 50;
        transition: opacity 260ms ease;
      }
      #peyk-boot[data-leaving='true'] {
        opacity: 0;
        pointer-events: none;
      }
      #peyk-boot .mark path,
      #peyk-boot .mark circle,
      #peyk-boot .mark rect {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: peyk-draw 1100ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #peyk-boot .mark :nth-child(2) { animation-delay: 90ms; }
      #peyk-boot .mark :nth-child(3) { animation-delay: 180ms; }
      #peyk-boot .mark :nth-child(4) { animation-delay: 260ms; }
      @keyframes peyk-draw {
        to { stroke-dashoffset: 0; }
      }
      #peyk-boot .wordmark {
        font: 650 15px/1 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.02em;
        color: #6b6b6b;
      }
      @media (prefers-reduced-motion: reduce) {
        #peyk-boot .mark * { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="peyk-boot" role="status" aria-live="polite" aria-label="Starting Peyk">
      <svg class="mark" width="76" height="76" viewBox="0 0 48 48" fill="none" aria-hidden="true"
           stroke="#CB2027" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13" cy="33" r="8" />
        <circle cx="35" cy="33" r="8" />
        <path d="M13 33 L20.5 19 L30 19 L35 33" />
        <rect x="17.5" y="10.5" width="9" height="9" rx="1.5" />
        <path d="M22 10.5 L22 19.5" />
      </svg>
      <span class="wordmark">Peyk</span>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
